<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAP User Accounts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
    color:#0a3d62;
}
body.dark-mode{background:#1f1f1f;color:#f0f4f8}

/* LOGIN */
#loginScreen{width:100%;height:100vh;display:flex;justify-content:center;align-items:center}
.login-card{
    background:#fff;
    padding:35px;
    border-radius:18px;
    width:340px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25)
}
.login-card input{
    width:90%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center
}
.login-card button{
    width:100%;
    margin-top:15px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#0a3d62,#2563eb);
    color:#fff;
    font-weight:bold
}
#loginError{color:red;font-size:13px;display:none}

/* MAIN */
#mainContent{display:none;max-width:1200px;margin:20px auto;padding:0 15px}

/* DASHBOARD GRID */
.dashboard-grid{
    display:grid;
    grid-template-columns: 1fr 360px;
    gap:20px;
    margin-top:20px;
}

/* LEFT */
.charts-column{
    display:grid;
    grid-template-columns: repeat(2,1fr);
    gap:15px;
}

.mini-card{
    background:#fff;
    padding:15px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.12)
}
.mini-card h2{font-size:22px;margin:5px 0}

/* RIGHT PANEL */
.side-panel{
    background:#fff;
    padding:15px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    display:flex;
    flex-direction:column;
    gap:10px;
	width: 150%;
}
.side-panel button{
    padding:8px;
    font-size:13px;
    border:none;
    border-radius:8px;
    color:#fff;
    background:linear-gradient(135deg,#0a3d62,#2563eb)
}

/* FORM */
#formContainer{display:none;margin-top:10px}
form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px
}
form label{grid-column:span 2;font-size:12px}
form input,form select{
    grid-column:span 2;
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
    text-align:center;
    font-size:12px
}
.form-buttons{
    grid-column:span 2;
    display:flex;
    justify-content:space-between
}
.btn-save{background:#2563eb;color:#fff}
.btn-clear{background:#7f8c8d;color:#fff}
.btn-delete{background:#c0392b;color:#fff}

/* TABLE */
#tableSection{display:none;margin-top:10px}
.table-wrapper{
    max-height:300px;
    overflow:auto;
    border-radius:10px
}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:#2563eb;color:#fff;position:sticky;top:0}
th,td{padding:6px;text-align:center}
tr:nth-child(even){background:#f1f4f7}

/* FILTER */
.filter-section{
    background:#f6f8fa;
    padding:8px;
    border-radius:8px;
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
}
.filter-section select,
.filter-section input{
    padding:6px;
    font-size:12px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* THEME TOGGLE */
#themeToggle{
    position:fixed;
    top:15px;
    left:15px;
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:#0a3d62;
    color:#fff
}
</style>
</head>

<body>

<div id="loginScreen">
    <div class="login-card">
        <h2>SAP TWA Users</h2>
        <input id="loginUsername" placeholder="Username">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="loginError">Wrong password, try again.</div>
    </div>
</div>

<div id="mainContent">
<button id="themeToggle" onclick="toggleTheme()">Toggle</button>

<h1>Flying V</h1>
<h3>TWA Inc.</h3>

<div class="dashboard-grid">

<div class="charts-column">
    <div class="mini-card"><p>Total Accounts</p><h2 id="totalAccounts">0</h2></div>
    <div class="mini-card"><p>Total Users</p><h2 id="totalUsers">0</h2></div>
    <div class="mini-card"><p>Users per Department</p><canvas id="deptChart" height="250"></canvas></div>
    <div class="mini-card"><p>Users per License</p><canvas id="licenseChart" height="120"></canvas></div>
</div>

<div class="side-panel">
<button onclick="showChangePassword()">Change Password</button>
<button onclick="showForm()">+ Add New User</button>
<button onclick="showAccounts()">List of Accounts</button>

<div id="formContainer">
<form id="userForm" onsubmit="saveUser();return false;">
<input type="hidden" id="editIndex">
<label>Username</label><input id="username" required>
<label>Account</label><input id="account" required>
<label>Password</label><input id="password" required>

<label>License</label>
<select id="license">
<option>Unidentified</option>
<option>Professional</option>
<option>Financial</option>
<option>Logistics</option>
</select>

<label>Department</label>
<select id="department">
<option>Unidentified</option>
<option>MIS</option>
<option>Accounting</option>
<option>Credit and Collection</option>
<option>Treasury</option>
<option>BPSM</option>
<option>Purchasing</option>
<option>ADP</option>
<option>Fleet Services</option>
<option>Marketing Services</option>
<option>Quadocs</option>
<option>Customer Service</option>
</select>

<label>Server</label>
<select id="server">
<option>Unidentified</option>
<option>10.0.1.7</option>
<option>10.0.1.6</option>
<option>10.0.1.45</option>
<option>10.0.1.46</option>
</select>

<div class="form-buttons">
<button type="button" class="btn-clear" onclick="hideForm()">Cancel</button>
<button type="button" class="btn-delete" onclick="deleteCurrentUser()">Delete</button>
<button type="submit" class="btn-save">Save</button>
</div>
</form>
</div>

<div id="tableSection">
<div class="filter-section">
<label>Department:</label>
<select id="filterDept" onchange="renderTable()">
<option value="">All</option>
<option>Unidentified</option>
<option>MIS</option>
<option>Accounting</option>
<option>Credit and Collection</option>
<option>Treasury</option>
<option>BPSM</option>
<option>Purchasing</option>
<option>ADP</option>
<option>Fleet Services</option>
<option>Marketing Services</option>
<option>Quadocs</option>
<option>Customer Service</option>
</select>
<input id="filterName" placeholder="Search..." oninput="renderTable()">
</div>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>#</th><th>User</th><th>Account</th><th>License</th><th>Department</th><th>Server</th><th>Action</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>
</div>
</div>

</div>
</div>
</div>

<script>
let managerPassword=localStorage.getItem("managerPassword")||"b1admin";
let users=JSON.parse(localStorage.getItem("sapUsers"))||[];
let deptChart,licenseChart;

function toggleTheme(){document.body.classList.toggle("dark-mode")}
function showForm(){formContainer.style.display="block";tableSection.style.display="none"}
function hideForm(){formContainer.style.display="none";userForm.reset();editIndex.value=""}
function showAccounts(){tableSection.style.display="block";formContainer.style.display="none";renderTable()}

function saveUser(){
 const d={account:account.value,username:username.value,password:password.value,license:license.value,department:department.value,server:server.value};
 editIndex.value===""?users.push(d):users[editIndex.value]=d;
 localStorage.setItem("sapUsers",JSON.stringify(users));
 hideForm();renderDashboard();renderTable();
}

function deleteCurrentUser(){
 if(editIndex.value!==""){users.splice(editIndex.value,1);localStorage.setItem("sapUsers",JSON.stringify(users));hideForm();renderDashboard();renderTable();}
}

function renderTable(){
 userTable.innerHTML="";
 let filtered=users.filter(u=>
 (filterDept.value===""||u.department===filterDept.value) &&
 (u.account+" "+u.username).toLowerCase().includes(filterName.value.toLowerCase())
 );
 filtered.forEach((u,i)=>{
  const r=userTable.insertRow();
  r.innerHTML=`<td>${i+1}</td><td>${u.username}</td><td>${u.account}</td><td>${u.license}</td><td>${u.department}</td><td>${u.server}</td>
  <td><button onclick="editUser(${users.indexOf(u)})">✏️</button></td>`;
 });
}

function editUser(i){
 const u=users[i];
 account.value=u.account;username.value=u.username;password.value=u.password;
 license.value=u.license;department.value=u.department;server.value=u.server;
 editIndex.value=i;showForm();
}

/* 🔹 HORIZONTAL ANIMATED BAR */
function renderCharts(){
 const dept={},lic={};
 users.forEach(u=>{
  dept[u.department]=(dept[u.department]||0)+1;
  lic[u.license]=(lic[u.license]||0)+1;
 });

 if(deptChart)deptChart.destroy();
 deptChart=new Chart(document.getElementById("deptChart"),{
  type:"bar",
  data:{
   labels:Object.keys(dept),
   datasets:[{
    data:Object.values(dept),
    backgroundColor:"F54927",
    borderRadius:8,
    barThickness:20
   }]
  },
  options:{
   indexAxis:'y', // 🔹 Horizontal
   plugins:{legend:{display:false}},
   scales:{x:{beginAtZero:true}},
   animation:{
    duration:1200,
    easing:"easeOutQuart",
    delay:(ctx)=>ctx.dataIndex*120
   }
  }
 });

 if(licenseChart)licenseChart.destroy();
 licenseChart=new Chart(document.getElementById("licenseChart"),{
  type:"pie",
  data:{labels:Object.keys(lic),datasets:[{data:Object.values(lic)}]},
  options:{plugins:{legend:{position:"bottom"}}}
 });
}

function renderDashboard(){
 totalAccounts.innerText=[...new Set(users.map(u=>u.account))].length;
 totalUsers.innerText=users.length;
 renderCharts();
}

function login(){
 if(loginUsername.value==="manager" && loginPassword.value===managerPassword){
  loginScreen.style.display="none";
  mainContent.style.display="block";
  renderDashboard();
 }else loginError.style.display="block";
}

function showChangePassword(){
 const p=prompt("New password:",managerPassword);
 if(p){managerPassword=p;localStorage.setItem("managerPassword",p)}
}
</script>
</body>
</html>
